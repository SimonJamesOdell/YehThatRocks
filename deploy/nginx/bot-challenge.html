<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>YehThatRocks — volunteer computing in progress…</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #0c0c13; color: #ececf2;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .box { text-align: center; padding: 24px; max-width: 420px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 13px; opacity: 0.65; margin: 0; }
  .credit { margin-top: 12px; font-size: 11px; opacity: 0.4; }
</style>
</head>
<body>
<div class="box">
  <h1>Checking your browser…</h1>
  <p id="status">This should only take a moment.</p>
  <p class="credit" id="credit" hidden>Your CPU cycles have been gratefully received by the YehThatRocks anti-scraper fund.</p>
</div>
<script>
(() => {
  const POW_SALT = "ytr-botok-v1:";
  const FALLBACK_DIFFICULTY_BITS = 24;
  const MIN_DIFFICULTY_BITS = 8;
  const MAX_DIFFICULTY_BITS = 40;

  const statusEl = document.getElementById("status");
  const creditEl = document.getElementById("credit");

  function setStatus(text) {
    if (statusEl) statusEl.textContent = text;
  }

  async function sha256(bytes) {
    return new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
  }

  function meets(digest, difficultyBits) {
    const fullBytes = difficultyBits >> 3;
    const remBits = difficultyBits & 7;
    for (let i = 0; i < fullBytes; i++) {
      if (digest[i] !== 0) return false;
    }
    if (remBits > 0) {
      const mask = 0xff << (8 - remBits);
      if ((digest[fullBytes] & mask) !== 0) return false;
    }
    return true;
  }

  async function fetchDifficulty() {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 3000);
      const res = await fetch("/api/bot-challenge", { signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) return FALLBACK_DIFFICULTY_BITS;
      const data = await res.json();
      const bits = Number(data && data.difficulty);
      if (!Number.isFinite(bits)) return FALLBACK_DIFFICULTY_BITS;
      return Math.max(MIN_DIFFICULTY_BITS, Math.min(MAX_DIFFICULTY_BITS, Math.floor(bits)));
    } catch {
      return FALLBACK_DIFFICULTY_BITS;
    }
  }

  async function solve(difficultyBits) {
    const encoder = new TextEncoder();
    const rand = new Uint8Array(12);
    crypto.getRandomValues(rand);
    const base = Array.from(rand, (b) => b.toString(16).padStart(2, "0")).join("");
    let counter = 0;
    for (;;) {
      const nonce = base + counter.toString(16);
      if (meets(await sha256(encoder.encode(POW_SALT + nonce)), difficultyBits)) {
        return nonce;
      }
      counter++;
    }
  }

  async function main() {
    const goto = document.referrer.startsWith(location.origin)
      ? document.referrer
      : "/";
    try {
      const difficultyBits = await fetchDifficulty();
      setStatus(
        difficultyBits >= 28
          ? "Heavier than usual right now — your browser is donating a few extra CPU cycles to the anti-scraper fund…"
          : "Solving a small puzzle to prove you're not a scraper…"
      );
      const nonce = await solve(difficultyBits);
      const res = await fetch("/api/bot-challenge", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nonce }),
      });
      if (res.ok && creditEl) {
        creditEl.hidden = false;
      }
      location.replace(res.ok ? goto : "/");
    } catch {
      location.replace("/");
    }
  }

  main();
})();
</script>
</body>
</html>
