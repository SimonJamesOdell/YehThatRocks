# Access-log control: drop 403/429/499 responses from access.log — they are
# bot-block / rate-limit noise, not real traffic. Referenced by the site
# config as `access_log ... if=$loggable;`.
map $status $loggable {
    default 1;
    403 0;
    429 0;
    499 0;
}

log_format ytr_timed '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
