# AI crawler detection map — sets $ai_crawler_limit_key to the IP for bots,
# or empty string for humans. An empty key means NGINX skips rate-limit tracking.
map $http_user_agent $ai_crawler_limit_key {
    default                                 "";
    "~*GPTBot"                              $binary_remote_addr;
    "~*Applebot"                            $binary_remote_addr;
    "~*Amazonbot"                           $binary_remote_addr;
    "~*anthropic"                           $binary_remote_addr;
    "~*ClaudeBot"                           $binary_remote_addr;
    "~*Bytespider"                          $binary_remote_addr;
    "~*CCBot"                               $binary_remote_addr;
    "~*PerplexityBot"                       $binary_remote_addr;
    "~*FacebookBot"                         $binary_remote_addr;
    "~*meta-externalagent"                  $binary_remote_addr;
    "~*Lightpanda"                          $binary_remote_addr;
    "~*DataForSeoBot"                       $binary_remote_addr;
    "~*PetalBot"                            $binary_remote_addr;
    "~*GoogleOther"                         $binary_remote_addr;
    "~*SemrushBot"                          $binary_remote_addr;
    "~*SERankingBacklinksBot"               $binary_remote_addr;
}

# 5 req/min for AI crawlers (~1 req every 12 seconds). Humans are not tracked.
limit_req_zone $ai_crawler_limit_key zone=ai_crawler_rl:10m rate=5r/m;
