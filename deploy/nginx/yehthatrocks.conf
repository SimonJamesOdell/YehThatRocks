# Nginx site config for yehthatrocks.com
# Install: sudo cp deploy/nginx/yehthatrocks.conf /etc/nginx/sites-available/yehthatrocks
#          sudo ln -sf /etc/nginx/sites-available/yehthatrocks /etc/nginx/sites-enabled/yehthatrocks
#          sudo nginx -t && sudo systemctl reload nginx

# Restore real visitor IPs from Cloudflare headers
include /etc/nginx/yehthatrocks-cloudflare-real-ip.inc;

server {
    server_name yehthatrocks.com www.yehthatrocks.com;

    # Block known cloud-provider IP ranges (data-centre only — no residential users).
    # Cloudflare real-IP module restores the true client IP, so deny works here.
    include /etc/nginx/yehthatrocks-cloud-deny.inc;
    include /etc/nginx/yehthatrocks-security-headers.inc;

    # Block known AI crawlers on ALL routes (pages, API, static) — they consume
    # CPU without bringing users. Previously this file was never included.
    include /etc/nginx/conf.d/yehthatrocks-bot-block.inc;
    include /etc/nginx/yehthatrocks-probe-block.inc;
    include /etc/nginx/yehthatrocks-challenge.inc;

    access_log /var/log/nginx/access.log ytr_timed if=$loggable;

    # Explicit compression for text assets and JSON responses.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Static assets served directly by Nginx (logo, favicons) so the
    # maintenance page renders even when the app container is completely down.
    location /images/ {
        alias /srv/yehthatrocks/images/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /favicons/ {
        alias /srv/yehthatrocks/favicons/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # User-uploaded avatars stored on the host volume (persists across deploys).
    # Served directly by nginx — no proxy to Next.js needed.
    location /avatars/ {
        alias /srv/yehthatrocks-data/avatars/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
    }

    # Static file downloads served directly by Nginx.
    location /files/ {
        alias /srv/yehthatrocks/files/;
        limit_req zone=page_rl burst=5 nodelay;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
    }

    # Next static build assets are content-addressed and safe to cache long-term.
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /maintenance.html;
    }

    # Keep favicon cacheable with a bounded TTL so updates eventually refresh.
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /maintenance.html;
    }

    location = /api/analytics {
        set $block_low_value_analytics_bot 0;

        if ($request_method = POST) {
            set $block_low_value_analytics_bot "${block_low_value_analytics_bot}1";
        }

        if ($http_user_agent ~* "(meta-externalagent|meta-externalfetcher|metaexternalhit|facebookexternalhit|facebookcatalog|Googlebot|Google-InspectionTool|Bingbot|BingPreview|LinkedInBot|Twitterbot|Slackbot|Discordbot|DuckDuckBot|redditbot|applebot|SkypeUriPreview|WhatsApp|ia_archiver|GPTBot|vkShare|quora link preview)") {
            set $block_low_value_analytics_bot "${block_low_value_analytics_bot}1";
        }

        if ($block_low_value_analytics_bot = "011") {
            return 204;
        }

        # Per-IP rate limit using the existing page_rl zone (60r/m = 1r/s).
        # burst=5 nodelay: allows 1r/s sustained + 5 burst before 503.
        limit_req zone=page_rl burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /maintenance.html;
    }

    location = /api/videos/unavailable {
        set $block_low_value_unavailable_bot 0;

        if ($request_method = POST) {
            set $block_low_value_unavailable_bot "${block_low_value_unavailable_bot}1";
        }

        if ($http_user_agent ~* "(meta-externalagent|meta-externalfetcher|metaexternalhit|facebookexternalhit|facebookcatalog|Googlebot|Google-InspectionTool|Bingbot|BingPreview|LinkedInBot|Twitterbot|Slackbot|Discordbot|DuckDuckBot|redditbot|applebot|SkypeUriPreview|WhatsApp|ia_archiver|GPTBot|vkShare|quora link preview)") {
            set $block_low_value_unavailable_bot "${block_low_value_unavailable_bot}1";
        }

        if ($block_low_value_unavailable_bot = "011") {
            return 403;
        }

        # Per-IP throttle on the most-abused endpoint (bots walk the catalog).
        limit_req zone=player_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /maintenance.html;
    }

    # High-frequency player API endpoints — per-IP throttle (player_api = 30r/m).
    # Catches /api/videos/share-preview, /api/videos/top and other catalog walks.
    location ^~ /api/videos/ {
        limit_req zone=player_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /maintenance.html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Throttle AI crawlers by UA (empty key for humans = no limit applied).
        limit_req zone=ai_crawler_rl burst=3 nodelay;
        limit_req_status 429;

        # Surface maintenance page on any upstream error.
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /maintenance.html;
    }

    location = /maintenance.html {
        root /srv/yehthatrocks/deploy/nginx;
        internal;
        add_header Retry-After 10;
        add_header Cache-Control "no-store";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yehthatrocks.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yehthatrocks.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


server {
    # Apply the same bot blocks on port 80 so scrapers hitting plain HTTP get
    # a silent 403 instead of a 301 that shows up as log noise. The ACME
    # challenge (certbot) is unaffected: its UA and path match none of these.
    include /etc/nginx/yehthatrocks-cloud-deny.inc;
    include /etc/nginx/conf.d/yehthatrocks-bot-block.inc;

    access_log /var/log/nginx/access.log ytr_timed if=$loggable;

    if ($host = www.yehthatrocks.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = yehthatrocks.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name yehthatrocks.com www.yehthatrocks.com;

    return 404; # managed by Certbot
}